<section class="card" id="notifications">
<div class="icon">#</div>
<div>
<h2>{{ titre() }}</h2>
<p>Vous avez {{notifications().length}} nouvelles notifications</p>
<button (click)="ShowNotifications()">{{bntTxt}}</button>

@if(show()){
@for(item of notifications();
track item){
<p class="notification">{{item.message}}</p>
}
}
</div>
</section>
